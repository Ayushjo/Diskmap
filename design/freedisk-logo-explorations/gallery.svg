<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">freedisk.space logo directions</title><desc id="desc">Four vector wordmarks proposed alongside the current open-f identity.</desc><rect width="1200" height="1140" fill="#F8F7F4"/><text x="40" y="63" fill="#252B31" font-family="-apple-system,Arial,sans-serif" font-size="36" font-weight="730">freedisk.space / logo directions</text><text x="42" y="94" fill="#6D7782" font-family="-apple-system,Arial,sans-serif" font-size="17">04 / Cleared stack is selected for the app and website.</text><g transform="translate(38 140)"><rect width="1124" height="221" rx="20" fill="#FFFFFF" stroke="#E1E3E7"/><text x="30" y="38" fill="#7966DA" font-family="-apple-system,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">01 / OPEN DISK</text><g transform="translate(17 40) scale(.75)"><path d="M130 59A48 48 0 1 0 140 109" fill="none" stroke="#252B31" stroke-width="19" stroke-linecap="round"/><path d="M126 54A48 48 0 0 1 145 89" fill="none" stroke="#7966DA" stroke-width="19" stroke-linecap="round"/><circle cx="93" cy="91" r="9" fill="#252B31"/><text x="175" y="116" fill="#252B31" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="730" letter-spacing="-3">freedisk</text><text x="424" y="116" fill="#7966DA" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="730" letter-spacing="-3">.space</text></g><text x="38" y="193" fill="#6D7782" font-family="-apple-system,Arial,sans-serif" font-size="17">A disk with a deliberate break: space you can see.</text></g><g transform="translate(38 385)"><rect width="1124" height="221" rx="20" fill="#FFFFFF" stroke="#E1E3E7"/><text x="30" y="38" fill="#7966DA" font-family="-apple-system,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">02 / MAPPED F</text><g transform="translate(17 40) scale(.75)"><path d="M54 143V47c0-8 6-14 14-14h57v23H78v29h43v22H78v36Z" fill="#252B31"/><rect x="78" y="85" width="43" height="22" rx="5" fill="#7966DA"/><rect x="126" y="33" width="22" height="23" rx="5" fill="#B9A8E8"/><text x="175" y="116" fill="#252B31" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="730" letter-spacing="-3">freedisk</text><text x="424" y="116" fill="#7966DA" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="730" letter-spacing="-3">.space</text></g><text x="38" y="193" fill="#6D7782" font-family="-apple-system,Arial,sans-serif" font-size="17">The first letter is built from storage-map tiles.</text></g><g transform="translate(38 630)"><rect width="1124" height="221" rx="20" fill="#FFFFFF" stroke="#E1E3E7"/><text x="30" y="38" fill="#7966DA" font-family="-apple-system,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">03 / FREE CORNER</text><g transform="translate(17 40) scale(.75)"><rect x="43" y="34" width="105" height="105" rx="23" fill="#252B31"/><path d="M61 52h34v34H61z" fill="#F8F7F4"/><path d="M101 52h29v34h-29z" fill="#7966DA"/><path d="M61 92h34v29H61z" fill="#9CA9B5"/><path d="M101 92h29v29h-29z" fill="#F8F7F4"/><path d="M127 88h22v31c0 12-7 20-19 20h-31v-19h21c5 0 7-2 7-7z" fill="#F8F7F4"/><text x="175" y="116" fill="#252B31" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="730" letter-spacing="-3">freedisk</text><text x="424" y="116" fill="#7966DA" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="730" letter-spacing="-3">.space</text></g><text x="38" y="193" fill="#6D7782" font-family="-apple-system,Arial,sans-serif" font-size="17">The missing tile is the point of the map.</text></g><g transform="translate(38 875)"><rect width="1124" height="221" rx="20" fill="#FFFFFF" stroke="#E1E3E7"/><text x="30" y="38" fill="#7966DA" font-family="-apple-system,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">04 / CLEARED STACK</text><g transform="translate(17 40) scale(.75)"><rect x="42" y="42" width="106" height="22" rx="11" fill="#252B31"/><rect x="42" y="77" width="82" height="22" rx="11" fill="#6D7782"/><rect x="42" y="112" width="53" height="22" rx="11" fill="#7966DA"/><path d="M133 88h15M105 123h43" stroke="#7966DA" stroke-width="4" stroke-linecap="round" opacity=".5"/><text x="175" y="116" fill="#252B31" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="730" letter-spacing="-3">freedisk</text><text x="424" y="116" fill="#7966DA" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="730" letter-spacing="-3">.space</text></g><text x="38" y="193" fill="#6D7782" font-family="-apple-system,Arial,sans-serif" font-size="17">A shrinking stack leaves room beside each layer.</text></g></svg>