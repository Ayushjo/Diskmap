name: Windows

# The .NET port under windows/ builds and tests on its own runner, and only
# when something under windows/ changes.
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build windows/DiskMap.Win.slnx

      - name: Test
        run: dotnet test windows/DiskMap.Win.slnx
